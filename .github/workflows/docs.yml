name: 'docs'

# Builds the documentation with warnings as errors, as Read the Docs does, and keeps the HTML
# as an artifact. Read the Docs builds and publishes it, see .readthedocs.yaml.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  docs:
    runs-on: ubuntu-24.04
    name: '📚 Sphinx'
    steps:

    - name: '🧰 Checkout'
      uses: actions/checkout@v4

    - name: '🐍 Setup Python'
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: '📚 Build'
      run: |
        pip install -r docs/requirements.txt
        sphinx-build -W --keep-going -b html docs docs/_build/html

    - name: '📤 Upload HTML'
      uses: actions/upload-artifact@v4
      with:
        name: docs-html
        path: docs/_build/html
